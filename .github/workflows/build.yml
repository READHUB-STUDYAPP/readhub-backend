name: Build & publish image

# On push to staging/main: typecheck, build the image, push to GHCR, then
# dispatch a deploy to readhub-infra. Developers PR into dev; promotion
# dev -> staging -> main triggers staging then production deploys.
on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/readhub-studyapp/readhub-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build   # tsc typecheck + emit dist/

      - name: Resolve target environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "moving=production"      >> "$GITHUB_OUTPUT"
            echo "dispatch=deploy-prod"   >> "$GITHUB_OUTPUT"
          else
            echo "moving=staging"         >> "$GITHUB_OUTPUT"
            echo "dispatch=deploy-staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.env.outputs.moving }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger infrastructure deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: READHUB-STUDYAPP/readhub-infra
          event-type: ${{ steps.env.outputs.dispatch }}
          client-payload: '{"service": "readhub-backend", "sha": "${{ github.sha }}"}'
